[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bingo-item-grading"
version = "0.1.0"
description = "Minecraft Bingo 地形包物品固有难度评分"
requires-python = ">=3.11"
dependencies = ["tqdm>=4.66", "pyyaml>=6"]

[project.scripts]
grading = "bingo_grading.cli:main"
bg = "bingo_grading.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow`：真实动作图上的整图求解（单条 10 秒以上）。日常回归默认跳过，
# 需要验证子图优化与全图一致时用 `pytest -m slow`。
markers = ["slow: 真实大图求解，默认不跑"]
addopts = "-m 'not slow'"
